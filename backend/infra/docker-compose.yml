services:

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: warehouse_twin
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper

  inventory-service:
    build:
      context: ../services/inventory-service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    depends_on:
      - postgres
      - kafka
      - redis
    environment:
      DB_URL: postgresql://user:password@postgres:5432/warehouse_twin
      KAFKA_BROKER: kafka:9092
      REDIS_URL: redis://redis:6379

  realtime-service:
    build:
      context: ..
      dockerfile: services/realtime-service/Dockerfile
    ports:
      - "8002:8002"
    depends_on:
      - kafka
  
  ai-service:
    build:
      context: ../services/ai-service
    ports:
      - "8005:8005"

volumes:
  postgres_data: